version: '3.8'

services:
  # Django Web Application
  web:
    build: .
    command: python projects/mastery_platform/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mastery_db
      - SECRET_KEY=dev-secret-key-change-in-production
    depends_on:
      - db
      - redis

  # PostgreSQL Database
  db:
    image: postgres:14
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=mastery_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Celery Worker
  celery:
    build: .
    command: celery -A mastery_platform worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mastery_db
    depends_on:
      - db
      - redis

  # Celery Beat (Scheduler)
  celery-beat:
    build: .
    command: celery -A mastery_platform beat -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mastery_db
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: mastery_network
